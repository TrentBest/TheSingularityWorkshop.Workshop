<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop diegetic composition tests</title>
<style>body{font:15px/1.5 system-ui;background:#0b1220;color:#edf4ff;max-width:900px;margin:40px auto;padding:0 20px}h1{color:#f2c66d}li{padding:7px 0;border-bottom:1px solid #ffffff18}.pass{color:#8ee0b2}.fail{color:#ff9b9b}code{color:#72d9ef}</style></head>
<body><h1>Workshop diegetic composition · host contract tests</h1><p>Deterministic browser tests. Provider resolution is supplied by the host; no provider code, network, storage, FSM_COS, or domain operation is executed.</p><p id="summary">Running…</p><ol id="results"></ol>
<script src="diegetic-composition.js"></script><script>
(function(){
 const results=document.getElementById("results"),summary=document.getElementById("summary");let passed=0,failed=0;
 function test(name,fn){const li=document.createElement("li");try{fn();li.className="pass";li.textContent="PASS · "+name;passed++}catch(e){li.className="fail";li.textContent="FAIL · "+name+" — "+e.message;failed++}results.append(li)}
 function throws(fn,part){let caught=false;try{fn()}catch(e){caught=true;if(part&&!e.message.includes(part))throw new Error("Expected "+part+", got "+e.message)}if(!caught)throw new Error("Expected operation to be rejected")}
 const providers={
  "tools.source.v1":{id:"tools.source.v1",contractVersion:"1",contribution:{tools:[{id:"source-tool",title:"Source tool",domain:{id:"domain.motion",version:"1"},ports:[{id:"result",title:"Motion result",direction:"output",schema:{id:"schema.motion",version:"1"}}]}]}},
  "tools.target.v1":{id:"tools.target.v1",contractVersion:"1",contribution:{tools:[{id:"target-tool",title:"Target tool",domain:{id:"domain.motion",version:"1"},ports:[{id:"input",title:"Motion input",direction:"input",schema:{id:"schema.motion",version:"1"}}]}]}},
  "tools.incompatible.v1":{id:"tools.incompatible.v1",contractVersion:"1",contribution:{tools:[{id:"other-tool",title:"Other tool",domain:{id:"domain.motion",version:"1"},ports:[{id:"input",title:"Different input",direction:"input",schema:{id:"schema.motion",version:"2"}}]}]}}
 };
 function host(extra){return WorkshopDiegeticComposition.createHost(Object.assign({workspaceId:"workspace-1",creatorId:"creator-1",trustedPublishers:["publisher-1"],resolveProvider:(bundle,decl)=>providers[decl.id]||null},extra||{}))}
 function bundle(id,provider,creator){return {id,version:"1.0.0",publisherId:"publisher-1",creatorId:creator||"creator-1",providers:provider?[{id:provider,contractVersion:"1"}]:[]}}
 function loadPair(h){const a=h.loadBundle(bundle("bundle-source","tools.source.v1"));const b=h.loadBundle(bundle("bundle-target","tools.target.v1"));return {a,b}}
 test("host requires a provider resolver",()=>throws(()=>WorkshopDiegeticComposition.createHost({workspaceId:"w",creatorId:"c"}),"resolver"));
 test("bundle with no provider remains a valid domain-only participant",()=>{const h=host();h.loadBundle(bundle("domain-only",null));if(h.snapshot.stations.length!==0||h.snapshot.bundles.length!==1)throw new Error("domain-only bundle was not retained cleanly")});
 test("provider resolution is pinned to declared opaque identity and contract version",()=>{const h=host();throws(()=>h.loadBundle({id:"bad",version:"1",publisherId:"publisher-1",providers:[{id:"tools.source.v1",contractVersion:"2"}]}),"does not match")});
 test("untrusted publisher is rejected before provider resolution",()=>{const h=host();throws(()=>h.loadBundle({id:"bad",version:"1",publisherId:"unknown",providers:[]}),"not trusted")});
 test("required host capabilities must be explicitly granted",()=>{const h=host({resolveProvider:()=>({id:"tools.source.v1",contractVersion:"1",contribution:{tools:[{id:"x",title:"X",domain:{id:"d",version:"1"},requiredCapabilities:["network.send"],ports:[]}]}})});throws(()=>h.loadBundle(bundle("needs-network","tools.source.v1")),"not granted")});
 test("duplicate tool identities are rejected",()=>{const h=host({resolveProvider:()=>({id:"tools.source.v1",contractVersion:"1",contribution:{tools:[{id:"x",title:"X",domain:{id:"d",version:"1"},ports:[]},{id:"x",title:"X2",domain:{id:"d",version:"1"},ports:[]}]}})});throws(()=>h.loadBundle(bundle("duplicates","tools.source.v1")),"Duplicate tool")});
 test("compatible typed ports produce a proposal, not an automatic connection",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-1",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});if(h.snapshot.connections.length!==0||p.id!=="connect-1")throw new Error("proposal executed without approval")});
 test("incompatible schema versions cannot connect",()=>{const h=host();const a=h.loadBundle(bundle("source","tools.source.v1"));const b=h.loadBundle(bundle("other","tools.incompatible.v1"));throws(()=>h.proposeConnection({id:"bad-link",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"}),"incompatible")});
 test("only the workspace creator can approve a proposal",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-2",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});throws(()=>h.approveConnection(p,{creatorId:"someone-else",proposalId:p.id}),"Only the workspace creator")});
 test("approval must name the exact proposal",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-3",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});throws(()=>h.approveConnection(p,{creatorId:"creator-1",proposalId:"other"}),"exact proposal")});
 test("approved connection is recorded with creator provenance",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-4",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});const c=h.approveConnection(p,{creatorId:"creator-1",proposalId:p.id,approvedAt:42});if(c.approvedBy!=="creator-1"||c.approvedAt!==42||h.snapshot.connections.length!==1)throw new Error("approval provenance missing")});
 test("workspace revision invalidates stale proposals",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-5",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});h.loadBundle(bundle("extra",null));throws(()=>h.approveConnection(p,{creatorId:"creator-1",proposalId:p.id}),"Stale")});
 test("unloading a bundle removes its stations and dependent connections",()=>{const h=host();const {a,b}=loadPair(h);const p=h.proposeConnection({id:"connect-6",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});h.approveConnection(p,{creatorId:"creator-1",proposalId:p.id});h.unloadBundle("bundle-source","creator-1");if(h.snapshot.stations.length!==1||h.snapshot.connections.length!==0)throw new Error("unload left orphaned composition state")});
 test("cross-creator connections require an explicit trust grant",()=>{const h=host();const a=h.loadBundle(bundle("creator-a","tools.source.v1","creator-a"));const b=h.loadBundle(bundle("creator-b","tools.target.v1","creator-b"));throws(()=>h.proposeConnection({id:"cross",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"}),"Cross-creator")});
 test("explicit cross-creator trust permits a proposal but not automatic approval",()=>{const h=host({trustedCreators:["creator-b"]});const a=h.loadBundle(bundle("creator-a","tools.source.v1","creator-a"));const b=h.loadBundle(bundle("creator-b","tools.target.v1","creator-b"));const p=h.proposeConnection({id:"cross-trusted",sourceStationId:a.mounted[0].id,sourcePortId:"result",targetStationId:b.mounted[0].id,targetPortId:"input"});if(h.snapshot.connections.length!==0)throw new Error("trust grant bypassed creator approval");h.approveConnection(p,{creatorId:"creator-1",proposalId:p.id})});
 summary.textContent=passed+" passed · "+failed+" failed";summary.className=failed?"fail":"pass";
})();
</script></body></html>
