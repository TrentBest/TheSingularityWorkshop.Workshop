name: Build and Test

on:
  push:
    branches:
      - master
      - development
      - feat/workshop-microbundle-publisher
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/TheSingularityWorkshop.Workshop.Publishing.Tests/TheSingularityWorkshop.Workshop.Publishing.Tests.csproj
      - name: Build
        run: dotnet build tests/TheSingularityWorkshop.Workshop.Publishing.Tests/TheSingularityWorkshop.Workshop.Publishing.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/TheSingularityWorkshop.Workshop.Publishing.Tests/TheSingularityWorkshop.Workshop.Publishing.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=workshop-publishing-tests.trx"
